<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="manifest.json?v=9">
  <title>mesh</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📡</text></svg>">
  <link rel="stylesheet" href="style.css?v=9">
</head>
<body>
<div class="app" id="app">

  <!-- HEADER -->
  <header class="header">
    <div class="header-left">
      <span class="status-dot" id="statusDot">&#9679;</span>
      <span class="header-title" id="headerTitle">mesh</span>
    </div>
    <div class="header-right" id="headerStats">
      <span class="header-stat" id="statNodes">0 nodes</span>
      <span class="header-stat" id="statMsgs">0 msgs</span>
    </div>
  </header>

  <!-- TABS -->
  <nav class="tabs" id="tabBar">
    <button class="tab active" data-tab="messages">messages</button>
    <button class="tab" data-tab="nodes">nodes</button>
    <button class="tab" data-tab="channels">channels</button>
    <button class="tab" data-tab="settings">settings</button>
  </nav>

  <!-- CONTEXT BANNER (channel + DM indicator) -->
  <div class="ctx-banner" id="ctxBanner"></div>

  <!-- MESSAGES TAB -->
  <div class="tab-panel active" id="panel-messages">
    <div class="search-row">
      <input type="text" class="search-input" id="msgSearch" placeholder="filter messages...">
    </div>
    <div class="list-scroll" id="messageList">
      <div class="empty-state">no messages yet</div>
    </div>
  </div>

  <!-- NODES TAB -->
  <div class="tab-panel" id="panel-nodes">
    <div class="search-row">
      <input type="text" class="search-input" id="nodeSearch" placeholder="filter nodes...">
      <button class="chip" id="sortBtn">sort: name</button>
      <button class="chip" id="roleBtn">role: all</button>
      <button class="chip" id="favOnlyBtn">&#9733;</button>
    </div>
    <div class="list-scroll" id="nodeList">
      <div class="empty-state">no nodes discovered</div>
    </div>
  </div>

  <!-- CHANNELS TAB -->
  <div class="tab-panel" id="panel-channels">
    <div class="list-scroll" id="channelList">
      <div class="empty-state">no channels</div>
    </div>
  </div>

  <!-- SETTINGS TAB -->
  <div class="tab-panel" id="panel-settings">
    <div class="settings-scroll">
      <div class="settings-section">
        <div class="section-head">connection</div>
        <div class="settings-row">
          <label class="settings-label">device</label>
          <input type="text" class="settings-input" id="deviceUrlInput" placeholder="meshtastic.local:4403">
        </div>
        <div class="settings-row">
          <label class="settings-label">channel</label>
          <input type="number" class="settings-input" id="channelInput" value="0" min="0" max="7">
        </div>
        <div class="settings-row">
          <label class="settings-label">poll (s)</label>
          <input type="number" class="settings-input" id="pollInput" value="2" min="1" max="60">
        </div>
        <div class="settings-actions">
          <button class="btn" id="saveSettingsBtn">save</button>
          <span class="settings-info" id="settingsInfo"></span>
        </div>
      </div>

      <div class="settings-section">
        <div class="section-head">device info</div>
        <div class="info-grid" id="deviceInfoGrid"></div>
      </div>

      <div class="settings-section">
        <div class="section-head">network</div>
        <div class="info-grid" id="netStatsGrid"></div>
      </div>

      <div class="settings-section">
        <div class="section-head">channel url</div>
        <div class="info-mono" id="channelUrlBox"></div>
      </div>

      <div class="settings-section">
        <div class="section-head">admin</div>
        <div class="admin-actions">
          <button class="btn" id="rebootBtn">reboot</button>
          <button class="btn" id="shutdownBtn">shutdown</button>
          <button class="btn" id="resetNodesBtn">reset nodedb</button>
        </div>
        <div class="settings-info" id="adminInfo"></div>
      </div>

      <div class="settings-section">
        <div class="section-head">paging</div>
        <div class="settings-row">
          <label class="settings-label">nodes/page</label>
          <input type="number" class="settings-input" id="nodePageSizeInput" value="30" min="5" max="200">
        </div>
        <div class="settings-row">
          <label class="settings-label">msgs/page</label>
          <input type="number" class="settings-input" id="msgPageSizeInput" value="50" min="10" max="200">
        </div>
      </div>

      <div class="settings-section">
        <div class="section-head">display</div>
        <div class="settings-row">
          <span class="settings-label">units</span>
          <button class="chip" id="unitsBtn">metric</button>
        </div>
        <div class="admin-actions">
          <button class="btn" id="themeBtn">invert</button>
        </div>
      </div>
    </div>
  </div>

  <!-- INPUT BAR (messages only) -->
  <div class="input-area" id="inputArea">
    <div class="dm-target" id="dmTarget"></div>
    <div class="input-row">
      <input type="text" class="input-field" id="inputField" placeholder="broadcast..." maxlength="200">
      <button class="btn btn-mini" id="emojiBtn">&#x1F600;</button>
      <button class="btn btn-send" id="sendBtn">send</button>
    </div>
    <div class="emoji-keyboard" id="emojiKeyboard" style="display:none;"></div>
  </div>

  <!-- STATUS BAR -->
  <div class="status-bar" id="statusBar">connecting...</div>

</div>

<!-- SELECT OVERLAY -->
<div class="overlay" id="selectOverlay">
  <div class="overlay-panel">
    <div class="overlay-head">
      <span class="overlay-title" id="selectTitle">select</span>
      <button class="btn btn-close" id="selectCancel">x</button>
    </div>
    <div class="overlay-body" id="selectOptions"></div>
  </div>
</div>

<!-- DETAILS OVERLAY -->
<div class="overlay" id="detailsOverlay">
  <div class="overlay-panel">
    <div class="overlay-head">
      <span class="overlay-title" id="detailsTitle">details</span>
      <button class="btn btn-close" id="detailsClose">x</button>
    </div>
    <div class="overlay-body" id="detailsContent"></div>
  </div>
</div>

<script src="app.js?v=9"></script>
</body>
</html>
